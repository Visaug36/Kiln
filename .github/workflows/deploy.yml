# Builds the static export and publishes it to GitHub Pages.
#
# Before the first run, set Settings → Pages → Source to "GitHub Actions".
# This cannot be automated: configure-pages can create the Pages site itself,
# but only with a token that has admin rights, and the GITHUB_TOKEN handed to a
# workflow does not ("Resource not accessible by integration").
#
# GitHub Pages on a private repository also requires a paid plan; on the free
# plan the repository has to be public for the site to be served.
#
# Every action here runs on node24. Node 20 was removed from the runners on
# 16 September 2026, so a node20 action is a hard failure, not a warning.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # The stage-1 scaffold branch, kept so work in flight on it still deploys.
      - claude/compassionate-lovelace-s20gwv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A broken build should not reach the site.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build static export
        run: pnpm build
        env:
          # A project site is served from /<repo>. Taken from GITHUB_REPOSITORY
          # rather than the event payload so it is correct on every trigger,
          # and so a rename cannot silently break every asset URL.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # The engines are only reachable through the registry's load(), so none of
      # them may appear in the entry chunk. Fails the build if that regresses.
      - name: Check bundle budget
        run: pnpm check:bundle

      # upload-pages-artifact excludes dotfiles unless told otherwise, and Pages
      # ignores _next/ without .nojekyll — a combination that publishes a broken
      # site while reporting success. Assert the file survived the build.
      - name: Assert .nojekyll is in the export
        run: |
          if [ ! -f out/.nojekyll ]; then
            echo "::error::out/.nojekyll is missing. GitHub Pages would ignore _next/ and serve a broken site."
            exit 1
          fi
          echo "out/.nojekyll present"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # Without this, the action's tar step adds --exclude=.[^/]* and drops
          # .nojekyll, so the assertion above would pass and the site would
          # still break. Both halves are needed.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages only accepts a deployment from the default branch: the github-pages
    # environment rejects any other ref, instantly and without a log, which
    # reads as a mysterious red X. Every branch in the trigger list still gets
    # built and tested — only the publish step is skipped where it could not
    # have worked. This stays correct whichever branch is the default.
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
