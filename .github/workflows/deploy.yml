# Builds the static export and publishes it to GitHub Pages.
#
# Before the first run, set Settings → Pages → Source to "GitHub Actions".
# This cannot be automated: configure-pages can create the Pages site itself,
# but only with a token that has admin rights, and the GITHUB_TOKEN handed to a
# workflow does not ("Resource not accessible by integration").
#
# GitHub Pages on a private repository also requires a paid plan; on the free
# plan the repository has to be public for the site to be served.
name: Deploy to GitHub Pages

on:
  push:
    # The scaffold branch is the default branch today. `main` is listed too so
    # deploys keep running after a merge or a default-branch rename, instead of
    # silently stopping with no failed run to notice.
    branches:
      - claude/compassionate-lovelace-s20gwv
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A broken build should not reach the site.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build
        env:
          # A project site lives at /<repo>. Derived so a rename cannot
          # silently break every asset URL.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
