# Builds the static export and publishes it to GitHub Pages.
#
# configure-pages turns Pages on by itself (enablement: true), so there is no
# setting to flip first. GitHub Pages on a private repository still requires a
# paid plan; on the free plan the repository has to be public to be served.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/compassionate-lovelace-s20gwv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A broken build should not reach the site.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build
        env:
          # A project site lives at /<repo>. Derived so a rename cannot
          # silently break every asset URL.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # enablement: true switches Pages on and sets its build type to Actions,
      # so a fresh clone of this repo deploys without anyone opening Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
